name: CI

on:
  push:
  pull_request:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intentuimvp/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff==0.14.10
      - name: Ruff check
        run: ruff check .

  typecheck-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intentuimvp/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pyright
        run: python -m pip install --upgrade pip pyright==1.1.407
      - name: Pyright
        run: python -m pyright

  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intentuimvp/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: intentuimvp/backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r requirements.txt
      - name: Pytest with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term --cov-report=html
      - name: Check coverage thresholds
        run: coverage report --fail-under=80
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: intentuimvp/backend/htmlcov/
          retention-days: 7

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intentuimvp/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: intentuimvp/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Canvas-first enforcement
        run: python3 scripts/check_canvas_first.py

  typecheck-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intentuimvp/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: intentuimvp/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intentuimvp/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: intentuimvp/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Vitest with coverage
        run: npm run test -- --run --coverage
      - name: Check coverage thresholds
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 75" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 75% threshold"
            exit 1
          fi
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: intentuimvp/frontend/coverage/
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  gateway-import-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run gateway import check
        shell: bash
        run: |
          set -euo pipefail
          target_dir="intentuimvp/backend/app"
          if [ ! -d "$target_dir" ]; then
            echo "::error ::Gateway import check failed: ${target_dir} not found."
            exit 2
          fi
          pattern='import.*openai|import.*anthropic|from.*openai|from.*anthropic'
          matches=$(grep -RInE "$pattern" "$target_dir" || true)
          if [ -n "$matches" ]; then
            echo "::error ::Direct provider imports detected. Use GatewayClient (app/gateway/client.py)."
            echo "$matches"
            exit 1
          fi
          echo "Gateway import check passed."
